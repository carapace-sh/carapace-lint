name: Test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: '[ "$(gofmt -l -s . | tee -a /dev/stderr)" = "" ]'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
